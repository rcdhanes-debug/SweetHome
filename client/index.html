<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#080d1a" />
    <meta name="description" content="Sweet Home - Shared home management for 9 housemates: collections, expenses and chores." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sweet Home" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="manifest" href="/manifest.json?v=20261014" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png?v=20261014" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png?v=20261014" />
    <link rel="preload" as="image" href="/welcome-photo.jpg" fetchpriority="high" />
    <title>Sweet Home</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #080d1a;
        overflow-x: hidden;
      }
    </style>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.unregister(); });
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          names.forEach(function(name) { caches.delete(name); });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
